# Author: Maifee Ul Asad <maifeeulasad@gmail.com>
# Co-Author: Claude Sonnet 4.6 <noreply@anthropic.com>
#
# CI: lint, type-check, unit tests, build
# Runs on every push and pull request to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint / Type-check / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      # Do NOT also set version here — pnpm/action-setup@v4 treats both as
      # conflicting declarations and fails with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Type-check (main)
        run: pnpm tsc -p src/main

      - name: Type-check (renderer)
        run: pnpm tsc -p src/renderer

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build
